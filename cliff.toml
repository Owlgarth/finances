# git-cliff configuration - changelog generation for Owlgarth Finances.
#
# Shared by the local release command (./dev.sh release, Task 2) and the CI
# release workflow (orhun/git-cliff-action pinned to git-cliff v2.13.1, Task 5).
# Output follows the Keep a Changelog heading style
# (https://keepachangelog.com/en/1.1.0/): "## [X.Y.Z] - YYYY-MM-DD" version
# sections with grouped conventional-commit entries beneath.
# Config reference: https://git-cliff.org/docs/configuration

[changelog]
# Rendered once at the top of CHANGELOG.md. The \n escapes are TOML escape
# sequences (blank lines after each text line).
header = """
# Changelog\n
All notable changes to Owlgarth Finances will be documented in this file.\n
"""
# Rendered once per release (version section). git-cliff v2.13.1 has no
# commit_groups filter (it exists only on unreleased git-cliff main), so the
# body iterates the four group names explicitly and filters commits per
# group. That preserves the section order defined by commit_parsers instead
# of group_by's alphabetical order. Sections with no commits are skipped.
# Trailing backslashes are TOML line continuations; trim removes the
# indentation they leave behind.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for g in ["Features", "Bug Fixes", "Documentation", "Miscellaneous"] %}\
    {% set group_commits = commits | filter(attribute="group", value=g) %}\
    {% if group_commits | length > 0 %}
    ### {{ g }}
    {% for commit in group_commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
    {% endif %}
{% endfor %}
"""
# Rendered once at the end - marker so readers know the file is generated.
footer = """
<!-- generated by git-cliff -->
"""
# Strip the leading/trailing whitespace the indented body template produces.
trim = true
# Historical commit subjects contain em/en dashes; the repo bans them in
# committed text. These postprocessors normalize both to plain hyphens in
# every rendered output (CHANGELOG.md and release notes). The patterns use
# regex \x{...} escapes so this file itself stays dash-free byte-wise.
postprocessors = [
    { pattern = '\x{2014}', replace = "-" },
    { pattern = '\x{2013}', replace = "-" },
]

[git]
# Parse commits according to https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not follow the conventional-commit format at all
# (merge commits, one-off messages) instead of grouping them.
filter_unconventional = true
# First match wins. feat -> Features, fix -> Bug Fixes, docs -> Documentation,
# every other conventional type (chore, ci, refactor, test, ...) ->
# Miscellaneous. Release commits made by ./dev.sh release are skipped so a
# release never lists itself. The body template hardcodes this same group
# order - keep the two lists in sync when changing groups.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^chore\\(release\\)", skip = true },
    { message = ".*", group = "Miscellaneous" },
]
# Only v-prefixed version tags are release section boundaries; the one-off
# `mit-final` tag must not split the changelog.
tag_pattern = "v[0-9].*"
# Oldest-first commit order within each group (matches git log reading order).
sort_commits = "oldest"
