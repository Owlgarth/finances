<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Owlgarth Finances - Personal Finance Tracker</title>

    <!-- PWA shell (N1): installable, standalone launch, themed chrome -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAFAFA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Owlgarth" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
      // Prevent flash of wrong theme — runs before React hydration.
      // owlgarth_theme: 'light' | 'dark' | null (null = default light; OS preference ignored)
      (function () {
        var theme = localStorage.getItem('owlgarth_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        // Language: keep <html lang> in sync with the stored choice pre-paint.
        // This mini-list MUST stay in sync with backend/common/languages.json
        // (the inline script cannot import the registry).
        var lang = localStorage.getItem('owlgarth_language');
        if (lang === 'en' || lang === 'uk' || lang === 'pl') {
          document.documentElement.lang = lang;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
