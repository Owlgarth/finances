[project]
name = "receipt-parser"
version = "0.1.0"
description = "Stateless receipt extraction service (implements CONTRACT.md v1)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "pillow-heif>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
pythonpath = ["."]
