[project]
name = "receipt-parser"
version = "0.2.0"
description = "Stateless receipt extraction service (implements CONTRACT.md v1)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=4.10",
]

[tool.uv]
# rapidocr depends on GUI opencv-python, which needs X11/GL libs absent from the
# slim server image; the headless wheel above provides cv2 instead. Mirrored by
# the overrides file in the Dockerfile (uv pip does not read this section).
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
pythonpath = ["."]
