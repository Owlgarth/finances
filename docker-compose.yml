# All configuration lives in .env (copy example.env). Start it with:
#
#   ./dev.sh up          # db, redis, storage
#                        # then run on the host (./dev.sh backend | frontend)
#   ./dev.sh up --full   # + api, ui, worker, beat
#
# The backend source is bind-mounted and `api` reloads on change. Container-owned
# paths (the uv environment) stay outside that mount so the host toolchain keeps
# working — see .agents/skills/docker-infra/SKILL.md.

x-backend: &backend
  build: ./backend
  # One shared tag, so api/worker/beat can never run different builds of the same
  # Dockerfile. Project-scoped, so a sibling checkout keeps its own image.
  image: ${COMPOSE_PROJECT_NAME}-backend
  user: root # the bind-mounted source is owned by the host user
  env_file: .env
  volumes:
    - ./backend:/app
    - backend-venv:/venv # UV_PROJECT_ENVIRONMENT, kept out of the bind mount
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # rustfs runs as uid 10001 and cannot chown a fresh named volume itself.
  storage-init:
    image: busybox:1.37
    command: chown -R 10001:10001 /data
    volumes:
      - storage-data:/data

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_SERVER_URL: ${S3_EXTERNAL_URL}
    ports:
      - "${STORAGE_PORT}:9000"
      - "${STORAGE_CONSOLE_PORT}:9001"
    volumes:
      - storage-data:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 10

  # Image entrypoint migrates, seeds, creates buckets and collects static.
  api:
    <<: *backend
    command:
      ["uv", "run", "uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT}:8000"

  worker:
    <<: *backend
    entrypoint: ["/app/celery-entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]

  beat:
    <<: *backend
    entrypoint: ["/app/celery-entrypoint.sh"]
    # --schedule keeps beat's state file out of the bind-mounted source tree
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

  # Production build served by nginx. For frontend work run ./dev.sh frontend
  # on the host instead — Vite's hot reload beats rebuilding this image.
  ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE}
    ports:
      - "${UI_PORT}:80"

  # The node toolchain for `./dev.sh frontend` and `./dev.sh npm`, so nothing has
  # to be installed on the host. Debian-based like the builder stage, so the
  # node_modules it writes also work if you run npm on a Linux host.
  node:
    profiles: ["tools"]
    image: node:22-slim
    working_dir: /app
    env_file: .env
    volumes:
      - ./frontend:/app
    ports:
      - "${UI_PORT}:5173"

volumes:
  db-data:
  redis-data:
  storage-data:
  backend-venv:
