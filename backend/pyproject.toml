[project]
name = "api"
version = "0.4.0"
description = "Add your description here"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.6",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.3",
    "django-storages>=1.14",
    "email-validator>=2.0",
    "factory-boy>=3.3.3",
    "faker>=40.4.0",
    "psycopg2-binary==2.9.13",
    "pyjwt>=2.10.1",
    "pyotp>=2.9.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "qrcode>=8.0",
    # kombu 5.6.2 (the celery[redis] broker transport) declares redis >=4.5.2,<6.5:
    # stay under its ceiling until Phase 6 ships kombu 5.7 with redis 8.
    "redis>=6.4,<6.5",
    "requests>=2.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
# extend-exclude, not exclude: keep ruff's defaults (.venv, caches) — outside a
# git checkout (e.g. in the api container) .gitignore isn't there to cover them.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["api"]
force-single-line = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.test_settings'
addopts = '--reuse-db'
python_files = ['test_*.py', '*_test.py', 'tests.py']
